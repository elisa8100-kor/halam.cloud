<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 AI 이미지 분류기</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <!-- Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        #webcam-container {
            margin: 20px;
        }

        #label-container {
            font-size: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <h1>🤖 나의 AI 이미지 분류기</h1>

    <p>카메라를 켜고 AI가 무엇인지 판단하게 해보세요.</p>

    <button onclick="init()">AI 시작</button>

    <div id="webcam-container"></div>
    <div id="label-container"></div>

    <script>
        // ⭐ Teachable Machine 모델 주소
        const URL = "https://teachablemachine.withgoogle.com/models/_ehZC_LBU/";

        let model;
        let webcam;
        let labelContainer;
        let maxPredictions;

        // AI 시작
        async function init() {

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // 모델 불러오기
            model = await tmImage.load(modelURL, metadataURL);

            maxPredictions = model.getTotalClasses();

            // 카메라 설정
            const flip = true;

            webcam = new tmImage.Webcam(300, 300, flip);

            await webcam.setup();
            await webcam.play();

            // 화면에 카메라 표시
            document
                .getElementById("webcam-container")
                .appendChild(webcam.canvas);

            // 결과 표시 영역
            labelContainer =
                document.getElementById("label-container");

            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(
                    document.createElement("div")
                );
            }

            // AI 실행
            window.requestAnimationFrame(loop);
        }

        // 계속 카메라 분석
        async function loop() {

            webcam.update();

            await predict();

            window.requestAnimationFrame(loop);
        }

        // AI 예측
        async function predict() {

            const prediction =
                await model.predict(webcam.canvas);

            for (let i = 0; i < maxPredictions; i++) {

                const percentage =
                    (prediction[i].probability * 100).toFixed(1);

                labelContainer.childNodes[i].innerHTML =
                    prediction[i].className +
                    " : " +
                    percentage +
                    "%";
            }
        }
    </script>

</body>
</html>
